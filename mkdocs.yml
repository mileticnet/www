site_name: Miletic
site_description: >-
  Miletic Family digital home: starting point for all the people and the activities Miletic.
site_author: Vedran Miletic
site_url: https://www.miletic.net/
copyright: >-
  Copyright © MMDCCLXVIII – MMDCCLXXIX <a href="https://calendars.fandom.com/wiki/Ab_urbe_condita">a.u.c.</a> (2015 – 2026 A.D.) <a href="https://vedran.miletic.net/">Dr. Vedran Miletic</a>.
  All rights reserved.
  <a href="#__consent">Cookie settings</a>.<br>
  Standards: <a href="https://validator.w3.org/nu/?doc=https%3A%2F%2Fwww.miletic.net%2F">HTML validation</a> ·
  <a href="https://uid0.com/ip6dc/miletic.net">IPv6 check</a>.<br>
  Security:
  <a href="https://www.ssllabs.com/ssltest/analyze.html?d=www.miletic.net">SSL test</a> ·
  <a href="https://hstspreload.org/?domain=miletic.net#submission-form">HSTS preload status</a> ·
  <a href="https://dnsviz.net/d/miletic.net/dnssec/">DNSSEC analysis</a>.<br>
  Domain checks:
  <a href="https://rdap.verisign.com/net/v1/domain/miletic.net">Registry lookup</a> ·
  <a href="https://rdap.dynadot.com/domain/miletic.net">Registrar lookup</a> ·
  <a href="https://whois.domaintools.com/miletic.net">WHOIS lookup</a> ·
  <a href="https://ahrefs.com/website-authority-checker/?input=miletic.net">Ahrefs website authority</a> ·
  <a href="https://moz.com/domain-analysis?site=miletic.net">Moz domain authority</a>.<br>
  Domain providers: <a href="https://www.verisign.com/">Verisign</a> (registry) ·
  <a href="https://www.dynadot.com/">Dynadot</a> (registrar) ·
  <a href="https://1984.hosting/">1984 Hosting</a> (DNS).
nav:
  - Miletic: index.md
  - GASERI: https://gaseri.org/
  - GASERI Blog: https://gaseri.org/en/blog/
  - RxTx: https://rxtx.one/
  - RxTx Research: https://rxtx.one/research/
theme:
  name: material
  variant: classic
  custom_dir: overrides
  features:
    - announce.dismiss
    - navigation.tabs
    - navigation.top
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/eye
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/eye-outline
        name: Switch to light mode
  font:
    text: PT Sans
    code: PT Mono
markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
extra:
  analytics:
    provider: google
    property: G-V3EKCHCVX7
  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.
  social:
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/vedranmiletic
      name: Vedran Miletic on Twitter
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/vedranmiletic
      name: Vedran Miletic on LinkedIn
    - icon: fontawesome/brands/github
      link: https://github.com/vedranmiletic
      name: Vedran Miletic on GitHub
    - icon: fontawesome/brands/gitlab
      link: https://gitlab.com/vedranmiletic
      name: Vedran Miletic on GitLab
plugins:
  - search
  - social
